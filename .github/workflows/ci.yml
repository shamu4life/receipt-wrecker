name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Manual re-run. Needed because a pull_request opened by a GitHub App token
  # does NOT trigger Actions (GitHub's guard against workflows spawning
  # workflows) — so a PR whose branch was pushed BEFORE it was opened never gets
  # a Validate run at all, and there was previously no way to ask for one. Push
  # any commit and `synchronize` fires normally; this covers the case where
  # there's nothing legitimate left to push.
  workflow_dispatch:

# Least-privilege GITHUB_TOKEN: this workflow only reads the repo.
permissions:
  contents: read

jobs:
  ci:
    name: Validate
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Unit tests
        run: npm test

      - name: Validate Worker & config (dry-run deploy)
        run: npx wrangler deploy --dry-run
